<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img"
  aria-label="Imagem de exemplo, 1200 por 800 pixels.">
  <style>
    .bg { fill: #f5f5f7 }
    .ln { stroke: #e3e3e6; stroke-width: 3 }
    .tx { fill: #6e6e73; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1c1e }
      .ln { stroke: #2a2a2d }
      .tx { fill: #8e8e93 }
    }
  </style>
  <rect class="bg" width="1200" height="800" />
  <line class="ln" x1="0" y1="0" x2="1200" y2="800" />
  <line class="ln" x1="1200" y1="0" x2="0" y2="800" />
  <rect class="bg" x="440" y="340" width="320" height="120" />
  <text class="tx" x="600" y="415" font-size="48" text-anchor="middle">1200 x 800</text>
</svg>
