<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img"
  aria-label="Imagem de exemplo, 1600 por 900 pixels.">
  <style>
    .bg { fill: #f5f5f7 }
    .ln { stroke: #e3e3e6; stroke-width: 3 }
    .tx { fill: #6e6e73; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-weight: 600 }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #1c1c1e }
      .ln { stroke: #2a2a2d }
      .tx { fill: #8e8e93 }
    }
  </style>
  <rect class="bg" width="1600" height="900" />
  <line class="ln" x1="0" y1="0" x2="1600" y2="900" />
  <line class="ln" x1="1600" y1="0" x2="0" y2="900" />
  <rect class="bg" x="620" y="390" width="360" height="120" />
  <text class="tx" x="800" y="465" font-size="52" text-anchor="middle">1600 x 900</text>
</svg>
